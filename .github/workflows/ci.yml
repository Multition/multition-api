name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run contracts:check
      - name: Verify committed contract types
        run: git diff --exit-code -- openapi/generated src/clients/generated
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
